# ============================================================================
# dsh-sao-animation —— DSH bundle patch
# ============================================================================
# 挂载声明：把这个插件作为一层插进 profile 的 loader 树。
# 宿主侧（Node）负责：注册 /dsh-boot/* 路由、往 index.html 注入一段引导脚本；
# 页面侧（浏览器/桌面壳）负责：拉 iframe、播动画、播完自己摘掉。
# ============================================================================

- insert:
    - id: dsh-sao-animation
      name: dsh-sao-animation
      config:
        enabled: true
